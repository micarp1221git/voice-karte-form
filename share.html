<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>診断結果をシェア | 声タイプ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #FDF2F5;
      color: #333;
      line-height: 1.6;
      text-align: center;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 1.2rem; color: #2B4BBF; margin-bottom: 16px; }
    .result-img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(232,92,138,0.2);
      margin-bottom: 20px;
    }
    button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 15px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .btn-x    { background: #000;    color: #fff; }
    /* みかさん指定: インスタのほうをピンク背景に（2026-08-11） */
    .btn-insta{ background: #E85C8A; color: #fff; }
    .btn-copy { background: #fff; color: #555; border: 1.5px solid #ddd; font-weight: 600; font-size: .95rem; padding: 13px; }
    /* みかさん2026-08-11: 画像つきでシェアは白背景に */
    .btn-share{ background: #fff; color: #444; border: 1.5px solid #ddd; }
    .note { margin-top: 18px; font-size: 0.8rem; color: #999; line-height: 1.9; text-align: left; }
    .note strong { color: #666; }
  </style>
</head>
<body>
<div class="container">
  <h1>診断結果をシェア</h1>
  <img class="result-img" id="resultImg" src="" alt="診断結果" style="display:none;">


  <button class="btn-x"     onclick="shareVia('x', this)">Xにシェア</button>
  <button class="btn-insta" onclick="shareVia('ig', this)">インスタにシェア</button>

  <!-- 押したあとに、1つずつ出る画面（2026-08-11みかさん確定の文言）
       ⚠️「待って」と「リポストして」を同時に言わない。上がってから初めてリポストの話を出す -->
  <div id="retryBox" style="display:none;">
    <p style="font-size:14px;color:#C2185B;margin:4px 0 10px;">うまく送れませんでした。少し待って、もう一度押してみてください。</p>
  </div>

  <div id="insta-sending" style="display:none;">
    <p style="font-size:15px;color:#666;margin:6px 0 6px;">送っています…</p>
    <p style="font-size:12.5px;color:#999;margin:0 0 14px;">このままお待ちください。1分ほどかかります。</p>
  </div>
  <div id="insta-done" style="display:none;">
    <p id="doneMsg" style="font-size:16px;font-weight:700;color:#2B4BBF;margin:6px 0 12px;">
      ✅ ボイストレーナーみかのインスタに上がりました</p>
    <a id="instaLink" href="https://www.instagram.com/micarp/" target="_blank" rel="noopener"
       style="display:block;background:#E85C8A;color:#fff;text-decoration:none;padding:16px;border-radius:14px;font-weight:700;font-size:1.05rem;">
      Instagramで見る</a>
    <p style="font-size:14px;color:#666;margin:10px 0 0;">ここからリポストしてね</p>
  </div>


</div>

<script>
  // 使い方: share.html?type=ねこ&img=<画像URL>
  // メールの「診断結果をシェアする」ボタンのリンク先。
  //
  // 🚨 2026-08-11 みかさんのテストで出た3つを直した:
  //   ①「シェア文をコピー」が何をコピーするのか分からない → **文を画面に出した**
  //   ② X も Instagram も無い → **Xは投稿画面を直接開く／Instagramは手順を出す**
  //   ③「シェアする」がPCでは黙ってコピーに化けていた → **スマホでだけ出す**ようにした
  var params = new URLSearchParams(location.search);
  var type = (params.get('type') || '').slice(0, 40);
  var imgUrl = params.get('img') || '';
  var userName = (params.get('name') || '').slice(0, 20);   // 結果メールのリンクに乗ってくるハンドルネーム（キャプション用）
  var extraImgs = (params.get('imgs') || '').slice(0, 1200);  // 分析画像のURL（|区切り・カルーセル/X複数枚用。無ければ1枚投稿）

  // メンション確定: @micarp（2026-08-08みかさん）
  var MENTION = '@micarp';
  var FORM_URL = 'https://micarp1221git.github.io/voice-karte-form/';


  if (imgUrl) {
    var el = document.getElementById('resultImg');
    el.src = imgUrl;
    el.style.display = 'block';
  }

  // 🚨 GASのWebアプリURL。デプロイしたらここに貼る（貼るまでは手順の表示に落ちる）
  // 2026-08-11: GAS案は行き止まり（WorkspaceのGASは外からのPOSTを全部弾く・実測）→ Cloudflare Workerへ
  var IG_ENDPOINT = 'https://koe-share-ig.micarp1221.workers.dev';

  async function shareVia(target, btn) {
    // ⭐ 1回に1つだけ言う（2026-08-11みかさん「2つのことを一気に伝えてる」）
    document.querySelector('.btn-x').style.display = 'none';
    document.querySelector('.btn-insta').style.display = 'none';
    var rb = document.getElementById('retryBox'); if (rb) rb.style.display = 'none';
    document.getElementById('insta-sending').style.display = 'block';
    try {
      // ⚠️ text/plain にするのは、余計な事前確認（プリフライト）を起こさないため
      var res = await fetch(IG_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ img: imgUrl, type: type, name: userName, imgs: extraImgs, target: target })
      });
      var data = await res.json();
      document.getElementById('insta-sending').style.display = 'none';
      if (data.ok) {
        var isX = (target === 'x');
        document.getElementById('doneMsg').textContent =
          isX ? '✅ ボイストレーナーみかのXに上がりました' : '✅ ボイストレーナーみかのインスタに上がりました';
        var a = document.getElementById('instaLink');
        a.textContent = isX ? 'Xで見る' : 'Instagramで見る';
        a.style.background = isX ? '#000' : '#E85C8A';   // X=黒・Instagram=ピンク（2026-08-11みかさん）
        a.href = data.permalink || (isX ? 'https://x.com/micarp' : 'https://www.instagram.com/micarp/');
        document.getElementById('insta-done').style.display = 'block';
      } else {
        showRetry_();
      }
    } catch (e) {
      document.getElementById('insta-sending').style.display = 'none';
      showRetry_();
    }
  }

  // 失敗したら、静かに元に戻して「もう一度」を出すだけ（2026-08-11みかさん「再度挑戦とかでなんとかならないの？」）
  function showRetry_() {
    var box = document.getElementById('retryBox');
    box.style.display = 'block';
    document.querySelector('.btn-x').style.display = 'block';
    document.querySelector('.btn-insta').style.display = 'block';
  }

</script>
</body>
</html>
