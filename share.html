<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>診断結果をシェア | 声タイプ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #FDF2F5;
      color: #333;
      line-height: 1.6;
      text-align: center;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 1.2rem; color: #2B4BBF; margin-bottom: 16px; }
    .result-img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(232,92,138,0.2);
      margin-bottom: 20px;
    }
    .share-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: #E85C8A;
      margin-bottom: 10px;
    }
    .copy-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      color: #555;
      border: 1.5px solid #ddd;
    }
    .note { margin-top: 16px; font-size: 0.8rem; color: #999; line-height: 1.8; }
  </style>
</head>
<body>
<div class="container">
  <h1>診断結果をシェア</h1>
  <img class="result-img" id="resultImg" src="" alt="診断結果" style="display:none;">
  <button class="share-btn" onclick="shareImage(this)">シェアする</button>
  <button class="copy-btn" onclick="copyText(this)">シェア文をコピー</button>
  <p class="note">シェア画面が開かない端末では、画像を長押しで保存して、<br>コピーした文と一緒に投稿してください。</p>
</div>

<script>
  // 使い方: share.html?type=ねこ&img=<画像URL>
  // メールの「診断結果をシェアする」ボタンのリンク先。画像つきでOSのシェアシートを開く。
  var params = new URLSearchParams(location.search);
  var type = (params.get('type') || '').slice(0, 10);
  var imgUrl = params.get('img') || '';

  // ⚠️ メンションの@アカウントは確定後に差し替え（X/Instagramで別名の可能性・みかさん確認待ち）
  var MENTION = '@voice_mika';
  var FORM_URL = 'https://micarp1221git.github.io/voice-karte-form/';
  var shareText = (type ? 'わたしの声は「' + type + 'タイプ」でした！ ' : '') +
    '声タイプ診断 ' + MENTION + ' #声タイプ診断 ' + FORM_URL;

  if (imgUrl) {
    var el = document.getElementById('resultImg');
    el.src = imgUrl;
    el.style.display = 'block';
  }

  async function shareImage(btn) {
    try {
      if (imgUrl && navigator.canShare) {
        var res = await fetch(imgUrl);
        var blob = await res.blob();
        var file = new File([blob], 'koe-type.png', { type: blob.type || 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: shareText });
          return;
        }
      }
      if (navigator.share) {
        await navigator.share({ text: shareText });
        return;
      }
      copyText(btn);
    } catch (e) { /* キャンセルは無視 */ }
  }

  function copyText(btn) {
    navigator.clipboard.writeText(shareText).then(function() {
      var old = btn.textContent;
      btn.textContent = 'コピーしました';
      setTimeout(function(){ btn.textContent = old; }, 1500);
    });
  }
</script>
</body>
</html>
