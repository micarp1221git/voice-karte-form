<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>診断結果をシェア | 声タイプ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #FDF2F5;
      color: #333;
      line-height: 1.6;
      text-align: center;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 1.2rem; color: #2B4BBF; margin-bottom: 16px; }
    .result-img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(232,92,138,0.2);
      margin-bottom: 20px;
    }
    /* 何がコピーされるのかを、先に見せる（2026-08-11みかさん「どれのことなのかわからなかった」） */
    .share-text {
      background: #fff;
      border: 1.5px solid #F3C6D4;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.92rem;
      line-height: 1.9;
      text-align: left;
      color: #444;
      margin-bottom: 10px;
      word-break: break-all;
      cursor: pointer;
      white-space: pre-wrap;   /* 改行をそのまま見せる（2026-08-11みかさん「改行もちゃんとして」） */
    }
    .share-text .lbl {
      display: block;
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 6px;
      letter-spacing: .04em;
    }
    button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 15px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .btn-x    { background: #000;    color: #fff; }
    /* みかさん指定: インスタのほうをピンク背景に（2026-08-11） */
    .btn-insta{ background: #E85C8A; color: #fff; }
    .btn-copy { background: #fff; color: #555; border: 1.5px solid #ddd; font-weight: 600; font-size: .95rem; padding: 13px; }
    /* みかさん2026-08-11: 画像つきでシェアは白背景に */
    .btn-share{ background: #fff; color: #444; border: 1.5px solid #ddd; }
    .note { margin-top: 18px; font-size: 0.8rem; color: #999; line-height: 1.9; text-align: left; }
    .note strong { color: #666; }
    #insta-guide {
      display: none;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.9;
      margin-bottom: 10px;
      color: #444;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>診断結果をシェア</h1>
  <img class="result-img" id="resultImg" src="" alt="診断結果" style="display:none;">

  <!-- ⭐ コピーされる文を、その場に出しておく -->
  <div class="share-text" id="shareBox" onclick="copyText(this)" role="button" tabindex="0"><span class="lbl" id="shareLbl">シェア文（タップでコピーできます）</span><span id="shareTextView"></span></div>

  <button class="btn-x"     onclick="shareVia('x', this)">Xにシェア</button>
  <button class="btn-insta" onclick="shareVia('ig', this)">インスタにシェア</button>

  <!-- 押したあとに、1つずつ出る画面（2026-08-11みかさん確定の文言）
       ⚠️「待って」と「リポストして」を同時に言わない。上がってから初めてリポストの話を出す -->
  <div id="insta-sending" style="display:none;">
    <p style="font-size:15px;color:#666;margin:6px 0 14px;">送っています…</p>
  </div>
  <div id="insta-done" style="display:none;">
    <p id="doneMsg" style="font-size:16px;font-weight:700;color:#2B4BBF;margin:6px 0 12px;">
      ✅ ボイストレーナーみかのインスタに上がりました</p>
    <a id="instaLink" href="https://www.instagram.com/micarp/" target="_blank" rel="noopener"
       style="display:block;background:#E85C8A;color:#fff;text-decoration:none;padding:16px;border-radius:14px;font-weight:700;font-size:1.05rem;">
      Instagramで見る</a>
    <p style="font-size:14px;color:#666;margin:10px 0 0;">ここからリポストしてね</p>
  </div>

  <div id="insta-guide">
    <!-- 🚨 2026-08-11 みかさん案「わたしの投稿にUPして、リポストで使ってもらう」を、
         実際に動く順番に直したもの。⚠️Webページから他人のアカウントへ投稿することはできないので、
         「先にご本人が出す → みかさんが拾う」の向きにしてある。狙い（みかさんのタイムラインに乗る）は同じ。 -->
    ① 上の画像を<strong>長押しして保存</strong><br>
    ② 上のシェア文をタップしてコピー<br>
    ③ ストーリーズに画像を貼って、コピーした文（<strong>@micarp</strong> が入っています）を貼り付け<br>
    <br>
    ⭐ <strong>@micarp が入っていると、みかさんに通知が届きます。</strong><br>
    みかさんのストーリーズで<strong>リポスト</strong>させてもらうので、そのまま使ってくださいね。
  </div>


  <p class="note">
    <strong>うまくいかないときは。</strong><br>
    画像を長押しで保存して、コピーした文と一緒に投稿してください。それでちゃんと届きます。
  </p>
</div>

<script>
  // 使い方: share.html?type=ねこ&img=<画像URL>
  // メールの「診断結果をシェアする」ボタンのリンク先。
  //
  // 🚨 2026-08-11 みかさんのテストで出た3つを直した:
  //   ①「シェア文をコピー」が何をコピーするのか分からない → **文を画面に出した**
  //   ② X も Instagram も無い → **Xは投稿画面を直接開く／Instagramは手順を出す**
  //   ③「シェアする」がPCでは黙ってコピーに化けていた → **スマホでだけ出す**ようにした
  var params = new URLSearchParams(location.search);
  var type = (params.get('type') || '').slice(0, 10);
  var imgUrl = params.get('img') || '';
  var userName = (params.get('name') || '').slice(0, 20);   // 結果メールのリンクに乗ってくるハンドルネーム（キャプション用）
  var extraImgs = (params.get('imgs') || '').slice(0, 1200);  // 分析画像のURL（|区切り・カルーセル/X複数枚用。無ければ1枚投稿）

  // メンション確定: @micarp（2026-08-08みかさん）
  var MENTION = '@micarp';
  var FORM_URL = 'https://micarp1221git.github.io/voice-karte-form/';
  // 🚨 2026-08-11 みかさん指定（改行の位置まで指定どおり）
  var shareText =
    'あなたは、もうやった？\n' +
    '\n' +
    (type ? 'わたしの声は「' + type + 'タイプ」でした！\n' : '') +
    '声タイプ診断\n' +
    MENTION + ' #声タイプ診断 ' + FORM_URL;

  document.getElementById('shareTextView').textContent = shareText;

  if (imgUrl) {
    var el = document.getElementById('resultImg');
    el.src = imgUrl;
    el.style.display = 'block';
  }

  // 🚨 GASのWebアプリURL。デプロイしたらここに貼る（貼るまでは手順の表示に落ちる）
  // 2026-08-11: GAS案は行き止まり（WorkspaceのGASは外からのPOSTを全部弾く・実測）→ Cloudflare Workerへ
  var IG_ENDPOINT = 'https://koe-share-ig.micarp1221.workers.dev';

  async function shareVia(target, btn) {
    // ⭐ 1回に1つだけ言う（2026-08-11みかさん「2つのことを一気に伝えてる」）
    if (btn) btn.style.display = 'none';
    document.getElementById('insta-sending').style.display = 'block';
    try {
      // ⚠️ text/plain にするのは、余計な事前確認（プリフライト）を起こさないため
      var res = await fetch(IG_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ img: imgUrl, type: type, name: userName, imgs: extraImgs, target: target })
      });
      var data = await res.json();
      document.getElementById('insta-sending').style.display = 'none';
      if (data.ok) {
        var isX = (target === 'x');
        document.getElementById('doneMsg').textContent =
          isX ? '✅ ボイストレーナーみかのXに上がりました' : '✅ ボイストレーナーみかのインスタに上がりました';
        var a = document.getElementById('instaLink');
        a.textContent = isX ? 'Xで見る' : 'Instagramで見る';
        a.href = data.permalink || (isX ? 'https://x.com/micarp' : 'https://www.instagram.com/micarp/');
        document.getElementById('insta-done').style.display = 'block';
      } else {
        if (btn) btn.style.display = 'block';
        showInstaFallback_(data.error);
      }
    } catch (e) {
      document.getElementById('insta-sending').style.display = 'none';
      if (btn) btn.style.display = 'block';
      showInstaFallback_('');
    }
  }

  // 失敗しても行き止まりにしない。手で出せる道を出す
  function showInstaFallback_(why) {
    var g = document.getElementById('insta-guide');
    g.style.display = 'block';
    g.insertAdjacentHTML('afterbegin',
      '<p style="color:#C2185B;margin:0 0 10px;">うまく送れませんでした。'
      + 'この手順なら、いま出せます。</p>');
  }

  function copyText(el) {
    navigator.clipboard.writeText(shareText).then(function() {
      // 枠をタップされたときは、中の文を消さずにラベルだけ変える（2026-08-11）
      var target = (el && el.id === 'shareBox') ? document.getElementById('shareLbl') : el;
      if (!target) return;
      var old = target.textContent;
      target.textContent = 'コピーしました';
      setTimeout(function(){ target.textContent = old; }, 1500);
    });
  }
</script>
</body>
</html>
